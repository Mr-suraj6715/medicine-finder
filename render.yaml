services:
  - type: web
    name: medifind-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend_python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ALLOWED_ORIGINS
        value: "https://medifind-delta.vercel.app,http://localhost:3000"
      - key: DATABASE_URL
        fromDatabase:
          name: medifind-db
          property: connectionString

databases:
  - name: medifind-db
    databaseName: medifind
    plan: free
    region: oregon
